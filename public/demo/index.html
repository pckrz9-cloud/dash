<script>
(function(){
"use strict";

/* ============================================================
   Per-person links
     ?name=Maya%20Ellis&biz=online%20fitness%20coaching&followers=6200
   Keys: name, handle, biz (or niche), followers, views, bio, note
   With none, the setter opens cold.
   ============================================================ */

var KEYS = ["name","handle","biz","niche","followers","views","bio","note"];

function readParams(){
  var out = {};
  [window.location.search, window.location.hash].forEach(function(src){
    var s = String(src || "").replace(/^[?#]/, "");
    if (!s) return;
    s.split("&").forEach(function(kv){
      var i = kv.indexOf("=");
      if (i < 1) return;
      var k, v;
      try {
        k = decodeURIComponent(kv.slice(0, i)).trim().toLowerCase();
        v = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
      } catch (e) { return; }
      v = v.replace(/[<>\r\n\t]+/g, " ").trim().slice(0, 90);
      if (k && v && KEYS.indexOf(k) > -1 && !out[k]) out[k] = v;
    });
  });
  return out;
}

var P = readParams();
var FIRST = P.name ? P.name.split(/\s+/)[0] : "";
var CALENDLY = "https://calendly.com/charlie-p-eighteen09marketing/eighteen09-meeting";

/* ============================================================
   THE SETTER

   Rules from the ai setter chxrlie workflow:
     - ONE message per turn, one question in it, always open ended
     - acknowledge in a few short words, never parrot back
     - short, direct, casual slang, no emojis, no "haha",
       no em dashes, no stating the obvious
     - an insight only when their answer reveals a pattern
     - clarify a vague answer before moving on
     - if they dodge, re-ask with "lmk on ..."
     - never pitch before the pain and the goal are on the table
     - never give a price, sell the meeting not the offer
     - the name is used in the first message only
     - rude, nonsense or existing client hands over to a human
   ============================================================ */

/* Non repeating picker, so nothing is said twice in a row. */
function rot(list){
  var pool = [];
  return function(){
    if (!pool.length) pool = list.slice();
    return pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
  };
}

var ack     = rot(["got it","makes sense","gotcha","sounds good","yeah makes sense","fair enough"]);
var ackWarm = rot(["love that","respect","solid target","thats a good one"]);
var soft    = rot(["all good","no worries","for sure","totally get that"]);

/* ---- warming up before any business question ---- */
var GOOD = /\b(good|great|fine|not bad|all good|well|grand|decent|cant complain|can.t complain|solid|alright|ok|okay|chillin|chilling|blessed|smashing it|vibing)\b/i;
var BAD  = /\b(tired|rough|stressed|not great|been better|awful|terrible|hectic|struggling|knackered|shattered|long week|dead)\b/i;

var hi       = rot(["yo","yo","hey","yooo"]);
var howsIt   = rot(["hows it going","u alright","hows things ur end","hows ur week been"]);
var reGood   = rot(["good to hear","nice one","love that","good stuff"]);
var reBad    = rot(["ah fair enough","sounds like a week","been there honestly","fair play for pushing through"]);
var reMeh    = rot(["gotcha","nice one","fair enough"]);
var mine     = rot([
  "been a busy one this end",
  "been heads down building stuff all week",
  "been flat out with client builds",
  "same here, been buried in work"
]);
var whatYou  = rot([
  "what u working on atm",
  "whats ur main thing rn",
  "what u got going on urself",
  "what are u building at the min"
]);

/* "u?" / "hbu" is them asking back, not dodging. */
var RECIP = /\b(u|you|urself|yourself|hbu|wbu|and (u|you)|how about (u|you)|what about (u|you))\s*\??\s*$/i;

function greetReact(t){
  if (BAD.test(t))  return reBad();
  if (GOOD.test(t)) return reGood();
  return reMeh();
}

/* Did their opener already say something worth reacting to? */
var GENERIC = { "creator": true };

function hasSubstance(t){
  if (isCompliment(t)) return false;
  var n = findNiche(t);
  return (!!n && !GENERIC[n]) || t.trim().split(/\s+/).length >= 7;
}
function isCompliment(t){
  return /\b(love (ur|your)|like (ur|your)|great (post|content|page|video|reel)|saw (ur|your)|nice (post|content|page)|ur content|your content|appreciate|good stuff|fire)\b/i.test(t);
}

/* ---- what they do, remembered and reused in the pitch ---- */
var NICHES = [
  {re:/\b(smma|social media marketing)\b/i,                          n:"smma owner"},
  {re:/\b(agency|agencies)\b/i,                                      n:"agency owner"},
  {re:/\b(paid ads|meta ads|facebook ads|google ads|media buy|ppc)\b/i, n:"ads guy"},
  {re:/\b(ecom|e-?comm|shopify|dropship|clothing brand|my store)\b/i, n:"ecom brand"},
  {re:/\b(fitness|gym|personal train|\bpt\b|nutrition|weight loss)\b/i, n:"fitness coach"},
  {re:/\b(edit|editor|editing|videographer|thumbnail)\b/i,            n:"editor"},
  {re:/\b(course|info product|digital product|cohort)\b/i,            n:"course creator"},
  {re:/\b(real estate|realtor|property|lettings)\b/i,                 n:"realtor"},
  {re:/\b(saas|software|my app)\b/i,                                  n:"saas founder"},
  {re:/\b(consult|consultancy|advisory)\b/i,                          n:"consultant"},
  {re:/\b(freelanc|contractor)\b/i,                                   n:"freelancer"},
  {re:/\b(coach|coaching|mentor|mentoring)\b/i,                       n:"coach"},
  {re:/\b(creator|influencer|personal brand|content)\b/i,             n:"creator"}
];

function plural(n){
  if (/[sxz]$|(ch|sh)$/i.test(n)) return n + "es";
  if (/[^aeiou]y$/i.test(n))      return n.replace(/y$/, "ies");
  return n + "s";
}

function findNiche(t){
  for (var i = 0; i < NICHES.length; i++) if (NICHES[i].re.test(t)) return NICHES[i].n;
  return "";
}

/* ---- what hurts, which decides the insight ---- */
var PAINS = [
  { re:/\b(dms?|messages?|inbox|replying|reply|keep up|keeping up)\b/i,
    insight:"most people we work with were drowning in dms before they systemised it" },
  { re:/\b(cold|ghost|ghosted|drop off|stop replying|no show|noshow|flake)\b/i,
    insight:"leads going cold is almost always a speed thing" },
  { re:/\b(convert|conversion|closing|close rate|book|booking|not booking)\b/i,
    insight:"getting them on the call is usually the leak, not the pitch" },
  { re:/\b(consistent|consistency|inconsistent|up and down|some months|feast|famine)\b/i,
    insight:"the up and down thing is nearly always a pipeline issue not a skill issue" },
  { re:/\b(fulfil|fulfill|deliver|delivery|capacity|onboarding|servicing)\b/i,
    insight:"that usually comes from working with people who arent ur dream clients" },
  { re:/\b(time|busy|hours|manual|manually|admin|burnt out|burnout|juggl)\b/i,
    insight:"the manual side eats way more time than people expect" },
  { re:/\b(leads?|enquir|inquir|prospects?|nobody|no one|dead|dry|quiet)\b/i,
    insight:"thats usually the biggest bottleneck honestly" },
  { re:/\b(charge|undercharg|pricing|cheap|discount)\b/i,
    insight:"pricing gets a lot easier when u have more demand than slots" }
];

var usedInsights = {};
function insight(t){
  for (var i = 0; i < PAINS.length; i++){
    if (PAINS[i].re.test(t) && !usedInsights[i]){
      usedInsights[i] = true;
      return PAINS[i].insight + ". ";
    }
  }
  return "";
}

/* ---- their goal, reused in the pitch the way the plan asks ---- */
function shortGoal(t){
  var m = t.match(/\b\d[\d,.]*\s*k\b(?:\s*months?\b|\s*(?:a|per)\s*month\b|\s*\/\s*mo\b)?/i)
       || t.match(/\b(?:double|triple|2x|3x|5x|10x)\s+[a-z ]{0,18}/i)
       || t.match(/\b\d+\s*(?:more\s*)?(?:clients?|customers?|students?|sales)\b/i);
  if (!m) return "";
  return m[0].trim().replace(/\s+/g, " ").toLowerCase().replace(/\b(our|my)\b/g, "ur");
}

/* "10 more clients" needs a different verb to "20k months". */
function goalClause(g){
  if (!g) return " close that gap";
  if (/^(double|triple|\dx)/.test(g))           return " help u " + g;
  if (/client|customer|student|sale/.test(g))    return " help u get " + g;
  return " help u hit " + g;
}

var mem = { niche: P.biz || P.niche || "", goal: "" };

/* ============================================================
   STEPS - each is one message with one question
   ============================================================ */

var askClarify = rot([
  "wdym by that exactly",
  "wheres the bottleneck, getting clients or something else",
  "whats making it hard specifically"
]);
var askApproach = rot([
  "what are u currently doing to get clients",
  "hows client acquisition been going for u",
  "wheres most of ur business coming from atm"
]);
var askGoal = rot([
  "where are u looking to take things in the next 90 days",
  "what kind of growth are u aiming for",
  "where do u wanna be in a few months"
]);
var askGap = rot([
  "be real with me, how close are u to that rn",
  "how far off are u from that",
  "honestly, how close are u to that"
]);

var STEP = {
  /* Pure rapport. No business question, nothing asked about their work. */
  greet: {
    ask: function(t){
      var name = FIRST ? " " + FIRST : "";
      if (isCompliment(t))  return "appreciate that" + name + ", glad it landed. " + howsIt();
      if (mem.niche)        return hi() + name + ", nice one. " + howsIt();
      return hi() + name + ", " + howsIt();
    },
    label: "hows things ur end"
  },
  /* Reacts to how they are, gives something back, then opens it up. */
  situation: {
    ask: function(t){
      return greetReact(t) + ", " + mine() + ". " + whatYou();
    },
    label: "what u got going on rn"
  },
  clarify:  { ask: function(){ return askClarify(); },
              label: "wheres the bottleneck" },
  approach: { ask: function(t){
                var ins = insight(t);
                var lead;
                if (BAD.test(t))            lead = reBad() + ", ";
                else if (ins)               lead = ack() + ", " + ins;
                else if (mem.niche)         lead = "sick, " + plural(mem.niche) + " are killing it rn. ";
                else                        lead = ack() + ", ";
                return lead + askApproach();
              },
              label: "what ur doing to get clients atm" },
  goal:     { ask: function(t){ return ack() + ", " + insight(t) + askGoal(); },
              label: "where ur trying to take things" },
  gap:      { ask: function(){ return ackWarm() + ", " + askGap(); },
              label: "how close u are to that" },
  pitch: {
    ask: function(){
      var who  = mem.niche ? "another " + mem.niche : "someone in the same spot";
      var goal = goalClause(mem.goal);
      return "get that a lot, just helped " + who + " go from there to a calendar that fills itself. think we could"
           + goal + " too, would u be down for a quick call this week";
    },
    label: "whether ur down for a quick call"
  }
};

var ORDER = ["greet","situation","approach","goal","gap","pitch"];
var BOOKED = "bettt, grab whatever time works for u " + CALENDLY;
var CLOSE  = " would it make sense to hop on for 15 min and find out";

/* ============================================================
   OBJECTIONS - interrupt without losing the question we're on
   ============================================================ */

var OBJ = [
  { id:"rude",
    re:/\b(fuck|shit|piss off|scam|scammer|stupid|idiot|dickhead|wanker|shut up|waste of time|bullshit)\b/i,
    reply:function(){ return "no worries, ill leave u to it"; },
    ends:true },

  { id:"client",
    re:/(already (a )?(client|working with)|im (a )?client|we already work together|ur my)/i,
    reply:function(){ return "ah my bad, ill get this over to charlie directly"; },
    ends:true },

  { id:"ai",
    re:/\b(is this (an?\s*)?(ai|bot|automated|real)|are (you|u) (an?\s*)?(ai|bot|real|human)|a bot\b|chatgpt|automated|u sound like|you sound like)/i,
    reply:function(){ return "of course, we teach ig sales with ai. would u really expect me to sit here myself ^^"; } },

  { id:"price",
    re:/(price|pricing|how much|what.*cost|the cost|charge|ur fee|your fee|expensive|afford|\bgbp\b|[£$]\s*\d)/i,
    reply:function(n){
      return n > 1
        ? "still gotta be the call for that one, itd be a made up number without knowing ur situation"
        : "price depends on ur situation and goals, thats why we need to chat first";
    }, book:true },

  { id:"proof",
    re:/(proof|case stud|results|testimonial|examples?|screenshots?|who have (u|you) work|any wins)/i,
    reply:function(){ return "yeah we've had clients do up to 400k a month with this, easier to show u properly on a call than paste screenshots"; },
    book:true },

  { id:"info",
    re:/(tell me more|more info|more about|how does it work|how it works|what is it|what do (u|you) (do|offer)|explain|whats the system|what.s the system|send.*info|more detail|whats the offer)/i,
    reply:function(n){
      return n > 1
        ? "genuinely quicker on a call, 15 min and ull see exactly how itd run on ur account"
        : "basically an ai setter that lives in ur dms, qualifies people and books them straight onto ur calendar. tough to explain the rest over text without knowing ur setup";
    }, book:true },

  { id:"dfy",
    re:/(done for me|do i have to|how much work|hands off|do i need to|set it up for me|who builds)/i,
    reply:function(){ return "we build and run the whole thing for u, ur only job is turning up to the calls it books"; } },

  { id:"howlong",
    re:/(how long|how quick|when would|how fast|time frame|timeframe|take to set|go live)/i,
    reply:function(){ return "usually live on ur account within a week or so, depends how ur dms are set up"; } },

  { id:"platform",
    re:/(tiktok|whatsapp|email|linkedin|youtube|facebook|twitter|only instagram|other platforms?)/i,
    reply:function(){ return "instagram dms is where we get the best numbers by a mile, thats what we focus on"; } },

  { id:"fit",
    re:/(work for (my|me)|does it work (for|with)|would it work|suit my|my niche|my industry|specific to)/i,
    reply:function(){ return "works anywhere u have people landing in ur dms, the qualifying just gets tuned to what ur selling"; } },

  { id:"have",
    re:/(already have|got (a|an) (setter|system|agency|va)|we do this|in house|doing this already)/i,
    reply:function(){ return "nice, most people who say that are still losing the ones that come in overnight. hows urs handling those"; } },

  { id:"who",
    re:/(who are (u|you)|how did (u|you) find|do i know (u|you)|where did (u|you) get|why are (u|you) messaging)/i,
    reply:function(){ return "charlie, i run eighteen09, we put ai setters into creator accounts. came across ur page and figured id reach out"; } },

  { id:"think",
    re:/(think about it|get back to (u|you)|ill think|i.ll think|maybe later|not sure yet|let me think|need to think|sleep on it)/i,
    reply:function(){ return "for sure, totally understand. its just a quick call to see IF this could even work for u, no pressure"; },
    book:true },

  { id:"time",
    re:/(no time|too busy|dont have time|don.t have time|havent got time|haven.t got time|busy (rn|right now|atm)|swamped|snowed under)/i,
    reply:function(){ return "totally get it, its literally 15 min and i just wanna see if i can help at all"; },
    book:true },

  { id:"nooffer",
    re:/(dont sell|don.t sell|nothing to sell|no offer|no product|no service|not selling|just starting|havent started|haven.t started|dont have (a )?(product|offer|service))/i,
    reply:function(){ return "gotchu, thats where most people start. ill send u the first product formula, it walks u through building an offer worth selling, and come back to me whenever ur up and running"; },
    ends:true }
];

/* ============================================================
   STATE - page load only, nothing stored
   ============================================================ */

var asked = null, clarified = false, pushedGap = false;
var locked = false, busy = false, started = false, done = false, awaitingBook = false;
var seen = {}, junk = 0, openerHadSubstance = false;

var $ = function(id){ return document.getElementById(id); };
var thread = $("thread"), msg = $("msg"), sendBtn = $("send");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s]+)/g, function(u){
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';
  });
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function scroll(){ thread.scrollTop = thread.scrollHeight; }

function tick(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  h = h % 12; if (h === 0) h = 12;
  $("clock").textContent = h + ":" + (m < 10 ? "0" + m : m);
}
tick(); setInterval(tick, 20000);

function addBubble(side, text){
  var row = document.createElement("div");
  row.className = "row " + side + " gap";
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = linkify(text);
  row.appendChild(b);
  thread.appendChild(row);
  scroll();
}
function addSeen(){
  var old = thread.querySelector(".seen");
  if (old) old.remove();
  var s = document.createElement("div");
  s.className = "seen";
  s.textContent = "Seen";
  thread.appendChild(s);
  scroll();
}
function showTyping(){
  var row = document.createElement("div");
  row.className = "row them gap";
  row.id = "typing";
  row.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  thread.appendChild(row);
  scroll();
}
function hideTyping(){ var t = $("typing"); if (t) t.remove(); }
function setBusy(v){ busy = v; sendBtn.disabled = v || locked; }

/* ============================================================
   ENGINE - every branch returns exactly one message
   ============================================================ */

var YES = /\b(yes|yea+h?|yep|yup|sure|ok|okay|alright|deal|im down|i.m down|lets do it|let.s do it|go on|why not|sounds good|sounds great|100|course|def|sign me up)\b/i;
var NO  = /\b(no|nah|nope|not really|not right now|not interested|im good|i.m good|no thanks|pass|not for me)\b/i;
var GREET = /^\s*(hey+|hi+|hello+|yo+|sup|wassup|what.?s up|morning|evening|hola)[\s!.,?]*$/i;

function isVague(t){
  var s = t.trim();
  if (/\d/.test(s)) return false;
  if (/^(not much|nothing|idk|dunno|not sure|the usual|this and that|stuff|a bit of everything|meh)\b/i.test(s)) return true;
  return s.split(/\s+/).length <= 3;
}
function isJunk(t){
  var s = t.trim();
  return s.length > 1 && !/[aeiou]/i.test(s) && /^[a-z]+$/i.test(s);
}
function isQuestion(t){
  return /\?/.test(t) || /^\s*(what|how|who|why|when|where|can (u|you)|do (u|you)|did (u|you)|is (it|this)|are (u|you)|whats|what.s|hows|how.s|would)\b/i.test(t);
}

function reask(){
  var k = asked && STEP[asked] ? asked : "situation";
  return " lmk on " + STEP[k].label + " tho";
}
function advance(t){
  var next = ORDER[ORDER.indexOf(asked) + 1];
  // They already told us what they do in the opener, so don't ask again.
  if (next === "situation" && mem.niche && openerHadSubstance) next = "approach";
  asked = next;
  if (next === "pitch") awaitingBook = true;
  return STEP[next].ask(t);
}

function reply(text){
  var t = String(text || "");

  if (done) return "already got u down, speak on the call";

  // Remember what they do and what they want, for the pitch.
  // A compliment about your content is not them telling you their niche.
  if (!isCompliment(t)){
    var found = findNiche(t);
    if (found && (!mem.niche || (GENERIC[mem.niche] && !GENERIC[found]))) mem.niche = found;
  }
  if (asked === "goal" && !mem.goal) mem.goal = shortGoal(t);

  // First contact is rapport only. Name used here and nowhere else.
  if (asked === null){
    openerHadSubstance = hasSubstance(t);
    asked = "greet";
    return STEP.greet.ask(t);
  }

  // Nonsense repeatedly hands over, per the workflow's handover rules.
  if (isJunk(t)){
    junk++;
    if (junk >= 2){ locked = true; return "cant really follow that, ill get charlie to pick this up"; }
    return "not sure i follow." + reask();
  }

  for (var i = 0; i < OBJ.length; i++){
    var o = OBJ[i];
    if (o.re.test(t)){
      seen[o.id] = (seen[o.id] || 0) + 1;
      var out = o.reply(seen[o.id]);
      if (o.ends){ locked = true; return out; }
      // Never jump to the pitch before the pain and the goal are on the table.
      var qualified = ORDER.indexOf(asked) >= ORDER.indexOf("gap");
      if (o.book && qualified){ awaitingBook = true; return out + "." + CLOSE; }
      if (o.book) return out + "." + reask();
      return out + "." + reask();
    }
  }

  if (awaitingBook){
    if (YES.test(t) && !NO.test(t)){ done = true; return BOOKED; }
    if (NO.test(t)){
      locked = true;
      return soft() + ", no pressure at all. just lmk whenever u wanna look at it";
    }
    if (isQuestion(t)) return "we can def get into that on the call." + reask();
    return soft() + "." + reask();
  }

  // Answering "hows it going" and asking back is not a dodge.
  var answeredGreeting = asked === "greet" && (GOOD.test(t) || BAD.test(t) || RECIP.test(t));
  if (isQuestion(t) && !GREET.test(t) && !answeredGreeting) return "we can def get into that." + reask();

  // Step 1.1 says clarify a vague answer before moving on.
  if (asked === "situation" && !clarified && (isVague(t) || GREET.test(t))){
    clarified = true; asked = "clarify";
    return STEP.clarify.ask();
  }
  if (asked === "clarify"){ asked = "situation"; return advance(t); }

  // Don't settle for a surface level answer on the gap.
  if (asked === "gap" && isVague(t) && !pushedGap){
    pushedGap = true;
    return "come on, gimme a bit more than that. how far off are u really";
  }

  return advance(t);
}

/* ---------- send ---------- */
async function send(){
  if (busy || locked) return;
  var text = msg.value.trim();
  if (!text) return;

  if (!started){
    started = true;
    var n = $("startNotice");
    if (n) n.remove();
    var stamp = document.createElement("div");
    stamp.className = "daystamp";
    stamp.textContent = "Today";
    thread.appendChild(stamp);
  }

  msg.value = "";
  msg.style.height = "auto";
  setBusy(true);

  addBubble("me", text);

  await sleep(430);
  addSeen();
  await sleep(520);

  // One reply, one bubble. Never a second message before they answer.
  var out = reply(text).replace(/\s+/g, " ").trim();

  showTyping();
  await sleep(Math.min(2200, 620 + out.length * 17));
  hideTyping();
  addBubble("them", out);

  if (locked){
    var c = $("composer");
    c.className = "locked";
    c.textContent = "Conversation paused.";
  }

  setBusy(false);
  if (!locked) msg.focus();
}

/* ---------- wiring ---------- */
msg.addEventListener("input", function(){
  msg.style.height = "auto";
  msg.style.height = Math.min(88, msg.scrollHeight) + "px";
});
msg.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
sendBtn.addEventListener("click", send);
msg.value = "";

})();
</script>
