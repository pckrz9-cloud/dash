.them .bubble{background:var(--ig-in); border-bottom-left-radius:5px}
.me .bubble{background:linear-gradient(105deg,var(--ig-out-a),var(--ig-out-b)); border-bottom-right-radius:5px}
.row.them + .row.them .bubble{border-bottom-left-radius:19px; border-top-left-radius:5px}
.row.me + .row.me .bubble{border-bottom-right-radius:19px; border-top-right-radius:5px}
.bubble a{color:#fff; text-decoration:underline; text-underline-offset:2px}
.seen{text-align:right; color:var(--ig-ink-2); font-size:11px; padding:4px 6px 2px}
.notice{text-align:center; color:var(--ig-ink-2); font-size:12px; line-height:1.5; padding:14px 26px 4px}

.typing{
  display:flex; gap:4px; align-items:center; padding:12px 15px;
  background:var(--ig-in); border-radius:19px; border-bottom-left-radius:5px;
}
.typing i{width:7px;height:7px;border-radius:50%;background:#8E8E8E;animation:blink 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,60%,100%{opacity:.35; transform:translateY(0)}30%{opacity:1; transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}.typing i{animation:none;opacity:.7}}

.suggest{
  display:flex; gap:7px; padding:0 11px 9px; overflow-x:auto; flex:none;
  scrollbar-width:none;
}
.suggest::-webkit-scrollbar{display:none}
.suggest:empty{display:none}
.sg{
  flex:none; background:transparent; border:1px solid #363636; color:var(--ig-ink);
  border-radius:16px; padding:6px 12px; font-size:13px; font-family:var(--font-phone);

}
.sg:hover{background:#1c1c1c; border-color:#4a4a4a}

.composer{

  display:flex; gap:9px; align-items:flex-end; flex:none;
}
.inputpill{
  flex:1; display:flex; align-items:center; gap:8px;
  border:1px solid #363636; border-radius:22px; padding:7px 6px 7px 15px;
}
#msg{
  flex:1; background:transparent; border:0; color:var(--ig-ink); font-family:inherit;
  font-size:16px; resize:none; max-height:88px; line-height:1.35; padding:1px 0;
}
#msg::placeholder{color:#8E8E8E}
#msg:focus{outline:none}
#send{
  background:none; border:0; color:#3797F0; font-weight:600; font-size:14.5px; cursor:pointer;

#send[disabled]{color:#3E5163; cursor:default}
.locked{

}
.footline{

.footline button{
  background:none; border:0; color:inherit; font:inherit; cursor:pointer;
  text-decoration:underline; text-underline-offset:2px; padding:0; opacity:.85;
}
.footline button:hover{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

<script>
(function(){
"use strict";

/* ============================================================
   Per-person links
     ?name=Maya%20Ellis&biz=online%20fitness%20coaching
   Keys: name, handle, biz (or niche), followers, note
   ============================================================ */

var KEYS = ["name","handle","biz","niche","followers","note"];

function readLead(){
  var out = {};
  [window.location.search, window.location.hash].forEach(function(src){
    var s = String(src || "").replace(/^[?#]/, "");
    if (!s) return;
    s.split("&").forEach(function(kv){
      var i = kv.indexOf("=");
      if (i < 1) return;
      var k, v;
      try {
        k = decodeURIComponent(kv.slice(0, i)).trim().toLowerCase();
        v = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, " "));
      } catch (e) { return; }
      v = v.replace(/[<>\r\n\t]+/g, " ").trim().slice(0, 90);
      if (k && v && KEYS.indexOf(k) > -1 && !out[k]) out[k] = v;
    });
  });
  return out;
}

var L = readLead();
var FIRST = L.name ? L.name.split(/\s+/)[0] : "";
var BIZ = L.biz || L.niche || "";
var CALENDLY = "https://calendly.com/charlie-p-eighteen09marketing/eighteen09-meeting";

/* ============================================================
   THE SETTER SCRIPT

   Rules this follows:
     - ONE message per turn. Never two bubbles, never a follow up
       before the lead has replied.
     - one question per message, always open ended
     - acknowledge in a few short words, never parrot back
     - short and direct, casual slang, no emojis, no "haha",
       no em dashes, no stating the obvious
     - clarify a vague answer before moving on
     - if they dodge, re-ask with "lmk on ..."
     - never pitch before the pain and the goal are on the table
     - the name is used in the first message only
   ============================================================ */

function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

var ACK      = ["got it","makes sense","gotcha","sounds good"];
var ACK_WARM = ["love that","respect","solid target"];

/* An insight only when their answer reveals a pattern.
   The plan says not to force one into every response. */
var INSIGHTS = [
  { test:/\b(dm|dms|messages|inbox|replies|replying)\b/i,
    line:"most people we work with were drowning in dms before systemising it" },
  { test:/\b(consistent|consistency|inconsistent|up and down|dry|quiet)\b/i,
    line:"thats usually the biggest bottleneck honestly" },
  { test:/\b(time|busy|hours|manual|manually|admin)\b/i,
    line:"the manual side eats more time than people expect" },
  { test:/\b(cold|ghost|ghosted|go cold|drop off|stop replying)\b/i,
    line:"leads going cold is almost always a speed thing" }
];

function insight(t){
  for (var i = 0; i < INSIGHTS.length; i++){
    if (INSIGHTS[i].test.test(t)) return INSIGHTS[i].line + ". ";
  }
  return "";
}

/* Each step is one message asking one question. `label` is how the
   question gets re-asked if the lead skips it. */
var STEP = {
  situation: {
    ask: function(){
      var q = BIZ
        ? "hows the " + BIZ + " side of things going rn"
        : "whats the main thing u got going on rn";
      return (FIRST ? "yo " + FIRST + ", " : "yo, ") + q;
    },
    label: "whats going on with things rn",
    chips: ["running a coaching business","i do paid ads for ecom brands","building my personal brand"]
  },
  clarify: {
    ask: function(){
      return pick([
        "wdym by that exactly",
        "wheres the bottleneck, getting clients or something else",
        "whats making it hard specifically"
      ]);
    },
    label: "wheres the bottleneck",
    chips: ["getting clients is the hard part","i get leads but they dont book","fulfilment eats all my time"]
  },
  approach: {
    ask: function(t){
      return pick(ACK) + ", " + insight(t) + "what are u currently doing to get clients";
    },
    label: "what ur doing to get clients atm",
    chips: ["posting reels and hoping","cold dms","referrals mostly"]
  },
  goal: {
    ask: function(t){
      return pick(ACK) + ", " + insight(t) + "where are u looking to take things in the next 90 days";
    },
    label: "where ur trying to take things",
    chips: ["double my client count","20k months","10 more clients"]
  },
  gap: {
    ask: function(){
      return pick(ACK_WARM) + ", be real with me, how close are u to that rn";
    },
    label: "how close u are to that",
    chips: ["not close at all","about halfway","pretty far off"]
  },
  pitch: {
    ask: function(){
      var who = BIZ ? "another " + BIZ : "someone in the same spot";
      return "get that a lot, just helped " + who
        + " go from there to a calendar that fills itself. would u be down for a quick call this week";
    },
    label: "whether ur down for a quick call",
    chips: ["yeah im down","whats the price","can u tell me more first"]
  }
};

var ORDER = ["situation","approach","goal","gap","pitch"];

var BOOKED = "bettt, grab whatever time works for u " + CALENDLY;
var CLOSE  = " would it make sense to hop on for 15 min and find out";

/* Objection handlers, from the workflow's Knowledge block. */
var OBJECTIONS = [
  {
    id:"ai",
    test:/\b(is this (an?\s*)?(ai|bot|automated|real)|are (you|u) (an?\s*)?(ai|bot|real|human)|a bot\b|chatgpt|automated|u sound like ai|you sound like ai)/i,
    reply:function(){ return "of course, we teach ig sales with ai. would u really expect me to sit here myself ^^"; },
    toBooking:false
  },
  {
    id:"price",
    test:/(price|pricing|how much|what.*cost|the cost|charge|ur fee|your fee|expensive|\bgbp\b|[£$]\s*\d)/i,
    reply:function(n){
      return n > 1
        ? "still gotta be the call for that one, itd be a made up number without knowing ur situation"
        : "price depends on ur situation and goals, thats why we need to chat first";
    },
    toBooking:true
  },
  {
    id:"info",
    test:/(tell me more|more info|more about|how does it work|how it works|what is it|what do (u|you) (do|offer)|explain|whats the system|what.s the system|send.*info|more detail)/i,
    reply:function(n){
      return n > 1
        ? "genuinely quicker on a call, 15 min and ull see exactly how itd run on ur account"
        : "tough to explain properly over text without knowing ur situation, thats why a quick call makes way more sense";
    },
    toBooking:true
  },
  {
    id:"think",
    test:/(think about it|get back to (u|you)|ill think|i.ll think|maybe later|not sure yet|let me think|need to think|sleep on it)/i,
    reply:function(){
      return "for sure, totally understand. its just a quick call to see IF this could even work for u, no pressure";
    },
    toBooking:true
  },
  {
    id:"time",
    test:/(no time|too busy|dont have time|don.t have time|havent got time|haven.t got time|busy (rn|right now|atm)|swamped|snowed under)/i,
    reply:function(){
      return "totally get it, its literally 15 min and i just wanna see if i can help at all";
    },
    toBooking:true
  },
  {
    id:"nooffer",
    test:/(dont sell|don.t sell|nothing to sell|no offer|no product|no service|not selling|just starting|havent started|haven.t started|dont have (a )?(product|offer|service))/i,
    reply:function(){
      return "gotchu, thats where most people start. ill send u the first product formula, it walks u through building an offer worth selling, and come back to me whenever ur up and running";
    },
    toBooking:false,
    ends:true
  }
];

/* ============================================================
   STATE - page load only, nothing stored
   ============================================================ */

var asked = null, clarified = false, pushedGap = false;
var locked = false, busy = false, started = false, done = false, awaitingBook = false;
var seen = {};

var $ = function(id){ return document.getElementById(id); };
var thread = $("thread"), msg = $("msg"), sendBtn = $("send"), suggest = $("suggest");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s]+)/g, function(u){
    return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';
  });
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function scroll(){ thread.scrollTop = thread.scrollHeight; }

function tick(){
  var d = new Date(), h = d.getHours(), m = d.getMinutes();
  h = h % 12; if (h === 0) h = 12;
  $("clock").textContent = h + ":" + (m < 10 ? "0" + m : m);
}
tick(); setInterval(tick, 20000);

/* ---------- thread ---------- */
function addBubble(side, text){
  var row = document.createElement("div");
  row.className = "row " + side + " gap";
  var b = document.createElement("div");
  b.className = "bubble";
  b.innerHTML = linkify(text);
  row.appendChild(b);
  thread.appendChild(row);
  scroll();
}
function addSeen(){
  var old = thread.querySelector(".seen");
  if (old) old.remove();
  var s = document.createElement("div");
  s.className = "seen";
  s.textContent = "Seen";
  thread.appendChild(s);
  scroll();
}
function showTyping(){
  var row = document.createElement("div");
  row.className = "row them gap";
  row.id = "typing";
  row.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  thread.appendChild(row);
  scroll();
}
function hideTyping(){
  var t = $("typing");
  if (t) t.remove();
}
function setChips(list){
  suggest.innerHTML = "";
  if (!list || !list.length || locked || done) return;
  list.forEach(function(t){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sg";
    b.textContent = t;
    b.addEventListener("click", function(){
      if (busy || locked) return;
      msg.value = t;
      send();
    });
    suggest.appendChild(b);
  });
}
function setBusy(v){
  busy = v;
  sendBtn.disabled = v || locked;
}

/* ============================================================
   ENGINE - every branch returns exactly one message
   ============================================================ */

var YES = /\b(yes|yea+h?|yep|yup|sure|ok|okay|alright|deal|im down|i.m down|lets do it|let.s do it|go on|why not|sounds good|100|course|def|sounds great)\b/i;
var NO  = /\b(no|nah|nope|not really|not right now|not interested|im good|i.m good|no thanks|pass|not for me)\b/i;
var GREET_ONLY = /^\s*(hey+|hi+|hello+|yo+|sup|wassup|what.?s up|morning|evening|hola)[\s!.,?]*$/i;

function isVague(t){
  var s = t.trim();
  if (/\d/.test(s)) return false;
  if (/^(not much|nothing|idk|dunno|not sure|the usual|this and that|stuff|a bit of everything)\b/i.test(s)) return true;
  return s.split(/\s+/).length <= 3;
}
function isQuestion(t){
  return /\?/.test(t) || /^\s*(what|how|who|why|when|where|can (u|you)|do (u|you)|did (u|you)|is (it|this)|are (u|you)|whats|what.s|hows|how.s)\b/i.test(t);
}

/* Re-ask the question they skipped, in the workflow's own phrasing. */
function reask(){
  var k = asked && STEP[asked] ? asked : "situation";
  return " lmk on " + STEP[k].label + " tho";
}

function advance(t){
  var next = ORDER[ORDER.indexOf(asked) + 1];
  asked = next;
  if (next === "pitch") awaitingBook = true;
  return STEP[next].ask(t);
}

function reply(text){
  var t = String(text || "");

  if (done) return "already got u down, speak on the call";

  // First contact. One question, name used here and nowhere else.
  if (asked === null){
    asked = "situation";
    return STEP.situation.ask();
  }

  // Objections interrupt without losing the question we were on.
  for (var i = 0; i < OBJECTIONS.length; i++){
    var o = OBJECTIONS[i];
    if (o.test.test(t)){
      seen[o.id] = (seen[o.id] || 0) + 1;
      var out = o.reply(seen[o.id]);
      if (o.ends){ locked = true; return out; }
      // Never jump to the pitch before the pain and the goal are on the table.
      var qualified = ORDER.indexOf(asked) >= ORDER.indexOf("gap");
      if (o.toBooking && qualified){
        awaitingBook = true;
        return out + "." + CLOSE;
      }
      return out + "." + reask();
    }
  }

  // After the ask, a yes books it and a no exits gracefully.
  if (awaitingBook){
    if (YES.test(t) && !NO.test(t)){ done = true; return BOOKED; }
    if (NO.test(t)){
      locked = true;
      return "all good, no pressure at all. just lmk whenever u wanna look at it";
    }
    if (isQuestion(t)) return "we can def get into that on the call." + reask();
    return "no worries either way." + reask();
  }

  // They asked something back instead of answering. Acknowledge, then re-ask.
  if (isQuestion(t) && !GREET_ONLY.test(t)){
    return "we can def get into that." + reask();
  }

  // Step 1.1 says clarify a vague answer before moving on.
  if (asked === "situation" && !clarified && (isVague(t) || GREET_ONLY.test(t))){
    clarified = true;
    asked = "clarify";
    return STEP.clarify.ask();
  }
  if (asked === "clarify"){
    asked = "situation";
    return advance(t);
  }

  // Don't settle for a surface level answer on the gap.
  if (asked === "gap" && isVague(t) && !pushedGap){
    pushedGap = true;
    return "come on, gimme a bit more than that. how far off are u really";
  }

  return advance(t);
}

function chipsNow(){
  if (done || locked) return [];
  if (awaitingBook) return STEP.pitch.chips;
  if (asked && STEP[asked]) return STEP[asked].chips;
  return [];
}

/* ---------- send ---------- */
async function send(){
  if (busy || locked) return;
  var text = msg.value.trim();
  if (!text) return;

  if (!started){
    started = true;
    var n = $("startNotice");
    if (n) n.remove();
    var stamp = document.createElement("div");
    stamp.className = "daystamp";
    stamp.textContent = "Today";
    thread.appendChild(stamp);
  }

  msg.value = "";
  msg.style.height = "auto";
  setBusy(true);
  setChips([]);

  addBubble("me", text);

  await sleep(430);
  addSeen();
  await sleep(520);

  // One reply, one bubble. Never a second message before they answer.
  var out = reply(text).replace(/\s+/g, " ").trim();

  showTyping();
  await sleep(Math.min(2200, 600 + out.length * 18));
  hideTyping();
  addBubble("them", out);

  if (locked){
    var c = $("composer");
    c.className = "locked";
    c.textContent = "Conversation paused.";
    suggest.innerHTML = "";
  } else {
    setChips(chipsNow());
  }

  setBusy(false);
  if (!locked) msg.focus();
}

/* ---------- restart ---------- */
var OPENERS = ["hey","saw ur post about the ai setter","hows it going"];

function restart(){
  asked = null; clarified = false; pushedGap = false;
  locked = false; busy = false; started = false; done = false; awaitingBook = false;
  seen = {};

  var c = $("composer");
  if (c.className === "locked"){
    c.className = "composer";
    c.innerHTML = '<div class="inputpill"><label class="sr" for="msg">Message</label>'
      + '<textarea id="msg" rows="1" placeholder="Message..." autocomplete="off"></textarea></div>'
      + '<button id="send" type="button">Send</button>';
    msg = $("msg"); sendBtn = $("send");
    wire();
  }

  thread.innerHTML =
    '<div class="intro">'
    + '<div class="bigav">CJ</div>'
    + '<div class="bigname">Chxrlie</div>'
    + '<div class="bighandle">chxrliejp &middot; Instagram</div>'
    + '<div class="meta">You follow each other on Instagram</div>'
    + '</div>'
    + '<div class="notice" id="startNotice">Send a message to start the conversation.</div>';

  msg.value = "";
  setChips(OPENERS);
  setBusy(false);
}

/* ---------- wiring ---------- */
function wire(){
  msg.addEventListener("input", function(){
    msg.style.height = "auto";
    msg.style.height = Math.min(88, msg.scrollHeight) + "px";
  });
  msg.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  sendBtn.addEventListener("click", send);
}

wire();
$("restart").addEventListener("click", restart);
msg.value = "";
setChips(OPENERS);

})();
</script>
